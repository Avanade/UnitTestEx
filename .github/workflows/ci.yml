name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Setup Azure Functions Core Tools
      run: npm install --global azure-functions-core-tools@4 --unsafe-perm true

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: MSTest (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.MSTest.Test/UnitTestEx.MSTest.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done

    - name: NUnit (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.NUnit.Test/UnitTestEx.NUnit.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done

    - name: xUnit (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.Xunit.Test/UnitTestEx.Xunit.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done

    - name: Aspire MSTest (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.Aspire.MSTest.Test/UnitTestEx.Aspire.MSTest.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done

    - name: Aspire NUnit (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.Aspire.NUnit.Test/UnitTestEx.Aspire.NUnit.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done

    - name: Aspire xUnit (net8.0, net9.0, net10.0)
      run: |
        for framework in net8.0 net9.0 net10.0; do
          dotnet test tests/UnitTestEx.Aspire.Xunit.Test/UnitTestEx.Aspire.Xunit.Test.csproj --framework "$framework" --configuration Debug --no-build --no-restore --verbosity normal
        done